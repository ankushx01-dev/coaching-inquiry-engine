<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{display_name}} chat</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #17212f; }
    main { max-width: 42rem; margin: 2rem auto; padding: 1.25rem; background: white; border-radius: .75rem; }
    #messages { display: grid; gap: .75rem; margin: 1.25rem 0; }
    .message { padding: .75rem 1rem; border-radius: .6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: #e8f0ff; justify-self: end; }
    .reply { background: #eef3f1; justify-self: start; }
    #typing-indicator { justify-self: start; color: #586579; }
    #typing-indicator span { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    #quick-reply-container { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; }
    form { display: flex; gap: .5rem; }
    input[type="text"] { flex: 1; min-width: 0; padding: .7rem; }
    button { padding: .65rem 1rem; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>{{display_name}}</h1>
    <section id="consent-panel" aria-labelledby="consent-title">
      <h2 id="consent-title">Before you begin</h2>
      <!-- TO_APPROVE -->
      <p>This is a private AI admissions assistant for {{display_name}}. It is not an official UPSC or government service. Messages are stored.</p>
      <label><input id="consent-check" type="checkbox"> I understand and agree to continue.</label>
      <button id="begin-button" type="button" disabled>Continue</button>
    </section>
    <section id="chat-panel" hidden aria-label="Chat">
      <div id="messages" aria-live="polite"></div>
      <div id="typing-indicator" class="message" hidden><span>Typing…</span></div>
      <div id="quick-reply-container" aria-label="Quick replies"></div>
      <form id="message-form">
        <label for="message-input">Message</label>
        <input id="message-input" type="text" maxlength="1000" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const consentPanel = document.getElementById("consent-panel");
    const consentCheck = document.getElementById("consent-check");
    const beginButton = document.getElementById("begin-button");
    const chatPanel = document.getElementById("chat-panel");
    const messageList = document.getElementById("messages");
    const typingIndicator = document.getElementById("typing-indicator");
    const quickReplyContainer = document.getElementById("quick-reply-container");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const status = document.getElementById("status");
    const tokenKey = "cie-chat-session";
    const shownReplyIds = new Map();
    const pendingReplies = new Map();
    const matchedReplyIds = new Set();
    const pollErrorText = "Unable to load messages. Please try again.";
    let pollTimerId = null;
    let pollInProgress = false;
    let consecutivePollFailures = 0;
    let sessionId = sessionStorage.getItem(tokenKey);

    if (!sessionId) {
      const bytes = crypto.getRandomValues(new Uint8Array(32));
      sessionId = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
      sessionStorage.setItem(tokenKey, sessionId);
    }

    consentCheck.addEventListener("change", () => {
      beginButton.disabled = !consentCheck.checked;
    });

    beginButton.addEventListener("click", () => {
      if (!consentCheck.checked) return;
      sessionStorage.setItem("cie-chat-consent", "true");
      consentPanel.hidden = true;
      chatPanel.hidden = false;
      input.focus();
      startPolling();
    });

    if (sessionStorage.getItem("cie-chat-consent") === "true") {
      consentPanel.hidden = true;
      chatPanel.hidden = false;
      startPolling();
    }

    function renderMessages(messages) {
      const orderedMessages = [...messages].sort((left, right) => {
        const receivedOrder = Date.parse(left.received_at) - Date.parse(right.received_at);
        return receivedOrder || left.message_id.localeCompare(right.message_id);
      });

      for (const message of orderedMessages) {
        if (shownReplyIds.has(message.message_id)) continue;
        const item = document.createElement("div");
        item.className = message.direction === "inbound" ? "message user" : "message reply";
        item.textContent = message.text;
        shownReplyIds.set(message.message_id, item);
      }

      messageList.replaceChildren(
        ...orderedMessages.map(message => shownReplyIds.get(message.message_id))
      );
      const pendingMessages = [...pendingReplies.entries()].sort((left, right) => {
        const leftMessage = orderedMessages.find(message => message.message_id === left[0]);
        const rightMessage = orderedMessages.find(message => message.message_id === right[0]);
        return Date.parse(leftMessage?.received_at ?? "") - Date.parse(rightMessage?.received_at ?? "");
      });
      for (const [inboundId, timerId] of pendingMessages) {
        const inbound = orderedMessages.find(message => message.message_id === inboundId);
        if (!inbound) continue;
        const inboundTime = Date.parse(inbound.received_at);
        const matchingReply = orderedMessages.find(
          message => message.direction === "outbound"
            && !matchedReplyIds.has(message.message_id)
            && Date.parse(message.received_at) >= inboundTime
        );
        if (matchingReply) {
          matchedReplyIds.add(matchingReply.message_id);
          clearTyping(inboundId, timerId);
        }
      }
    }

    function clearTyping(messageId, timerId) {
      window.clearTimeout(timerId);
      pendingReplies.delete(messageId);
      typingIndicator.hidden = pendingReplies.size === 0;
    }

    function showTyping(messageId) {
      const timerId = window.setTimeout(() => {
        pendingReplies.delete(messageId);
        typingIndicator.hidden = pendingReplies.size === 0;
      }, 30000);
      pendingReplies.set(messageId, timerId);
      typingIndicator.hidden = false;
    }

    function renderQuickReplies(messages, quickReplies) {
      quickReplyContainer.replaceChildren();
      if (!messages.some(message => message.direction === "outbound")) return;
      for (const quickReply of quickReplies) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = quickReply.label;
        button.addEventListener("click", () => {
          void sendAction(quickReply.action_id);
        });
        quickReplyContainer.append(button);
      }
    }

    async function pollMessages() {
      if (pollInProgress) return;
      pollInProgress = true;
      try {
        const query = new URLSearchParams({ session_id: sessionId });
        const response = await fetch(`/v1/chat/messages?${query.toString()}`);
        if (!response.ok) throw new Error("Could not load messages");
        const data = await response.json();
        renderMessages(data.messages);
        renderQuickReplies(data.messages, data.quick_replies);
        consecutivePollFailures = 0;
        if (status.textContent === pollErrorText) status.textContent = "";
      } catch (_error) {
        consecutivePollFailures += 1;
        if (consecutivePollFailures >= 3) status.textContent = pollErrorText;
      } finally {
        pollInProgress = false;
      }
    }

    function startPolling() {
      if (pollTimerId !== null) return;
      void pollMessages();
      pollTimerId = window.setInterval(() => void pollMessages(), 2000);
    }

    async function sendMessage(messageText) {
      const text = messageText.trim();
      if (!text) return;
      await submitMessage({ text });
    }

    async function sendAction(actionId) {
      await submitMessage({ action_id: actionId });
    }

    async function submitMessage(content) {
      status.textContent = "Sending…";
      try {
        const response = await fetch("/v1/chat/messages", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            client_message_id: crypto.randomUUID(),
            ...content,
            consent_given: true
          })
        });
        if (response.status === 429) {
          status.textContent = "You're sending messages too quickly. Please wait a minute.";
          return;
        }
        if (response.status === 422) {
          status.textContent = "That message could not be sent. Check its length and try again.";
          return;
        }
        if (response.status >= 500) {
          status.textContent = "Something went wrong. Please try again.";
          return;
        }
        if (!response.ok) {
          status.textContent = "Something went wrong. Please try again.";
          return;
        }
        const accepted = await response.json();
        showTyping(accepted.message_id);
        if (content.text && input.value.trim() === content.text.trim()) {
          input.value = "";
        }
        status.textContent = "";
      } catch (_error) {
        status.textContent = "Something went wrong. Please try again.";
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      void sendMessage(input.value);
    });

  </script>
</body>
</html>
